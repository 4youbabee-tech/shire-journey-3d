name: Browser-rendered QA evidence
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  chromium-webgl:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check && node --check tests/browser-qa.mjs && node --check tests/published-smoke.mjs && node --check tests/party-playback.mjs && npm test
      - name: Install pinned QA browser automation
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Exercise a real WebGL canvas and record playback
        env:
          EXPECTED_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node tests/browser-qa.mjs
          QA_OUT=qa-evidence/bywater node tests/bywater-playback.mjs
          QA_OUT=qa-evidence/full-opening node tests/opening-playback.mjs
          QA_OUT=qa-evidence/full-party node tests/party-playback.mjs
          QA_OUT=qa-evidence/full-revelation node tests/revelation-playback.mjs
      - name: Preserve screenshots, video and performance report even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shire-browser-evidence
          path: qa-evidence/
          retention-days: 90
          if-no-files-found: warn


  shire-road:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Record natural road encounters and ferry
        env:
          EXPECTED_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          QA_OUT: qa-evidence/shire-road
        run: node tests/road-playback.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shire-road-playback
          path: qa-evidence/shire-road/
          retention-days: 90

  published-game:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install pinned public-game browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify the permanent public game and actual movement
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          QA_OUT: qa-evidence/published
        run: node tests/published-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shire-published-playback
          path: qa-evidence/published/
          retention-days: 90

  b1-evidence:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm run check && npm test
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1 && npx playwright install --with-deps chromium
      - uses: actions/checkout@v4
        with:
          ref: 9779857b1a7d802980056ecff3ed4048954e7881
          path: b1-baseline
      - name: Reconstruct immutable 0.14.1 reference
        working-directory: b1-baseline
        run: npm ci
      - name: Capture reference and candidate with identical cameras
        env:
          EXPECTED_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          QA_DIST=b1-baseline/dist QA_OUT=qa-evidence/before-0.14.1 EXPECTED_COMMIT_SHA=9779857b1a7d802980056ecff3ed4048954e7881 node tests/golden-shots.mjs
          QA_OUT=qa-evidence/golden node tests/golden-shots.mjs
          node tests/perf-playback.mjs
          python3 -m pip install Pillow==11.3.0
          python3 tests/golden-contact-sheet.py qa-evidence/before-0.14.1 qa-evidence/golden qa-evidence/b1-comparison.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shire-b1-evidence
          path: qa-evidence/
          retention-days: 90

  bree-playback:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm run check && npm test
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Walk through Bree, meet the innkeeper and Strider, rest and reload
        env:
          EXPECTED_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          QA_OUT: qa-evidence/bree
        run: node tests/bree-playback.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shire-bree-playback
          path: qa-evidence/bree/
          retention-days: 90

  ring-inspection:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm run check && npm test
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Inspect, cancel, complete and restore the Ring interaction
        env:
          EXPECTED_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          QA_OUT: qa-evidence/ring-inspection
        run: node tests/ring-inspection-playback.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shire-ring-inspection
          path: qa-evidence/ring-inspection/
          retention-days: 90
