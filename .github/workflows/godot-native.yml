name: Native Godot Chapter I - verify and Windows export
on:
  push:
    branches:
      - production/godot-native-*
      - production/shire-social-world-v4-*
    paths:
      - 'native-godot/**'
      - '.github/workflows/godot-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-import-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Author Bag End PBR portal in Blender and export GLB
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          blender -b --factory-startup -t 2 --python native-godot/tools/blender_build_bag_end.py
      - name: Generate three handcrafted Blender world assets and source projects
        run: blender -b --factory-startup -t 2 --python native-godot/tools/blender_build_shire_districts.py
      - name: Author four real woodland Blender GLBs and editable source projects
        run: blender -b --factory-startup -t 2 --python native-godot/tools/blender_build_shire_hero_trees.py
      - name: Enforce botanical geometry budgets and original asset provenance
        run: python3 native-godot/tools/verify_shire_hero_trees.py
      - name: Upload real woodland editable Blender sources and GLBs
        uses: actions/upload-artifact@v4
        with:
          name: ShireJourney-HeroWoodland-Blender-GLB
          path: |
            blender-production/shire_botanical_hero/*.blend
            native-godot/assets/models/shire_hero_*.glb
            native-godot/assets/models/shire_hero_*.source.json
          retention-days: 14
      - name: Verify Shire craftwork GLBs, material batching and provenance
        run: python3 native-godot/tools/verify_shire_districts.py
      - name: Upload editable market, mill and feast Blender sources
        uses: actions/upload-artifact@v4
        with:
          name: ShireJourney-Districts-Editable-Blender
          path: blender-production/shire_districts/*.blend
          retention-days: 14
      - name: Upload new market, mill and feast GLBs for Windows packaging
        uses: actions/upload-artifact@v4
        with:
          name: ShireJourney-Districts-Production-GLB
          path: |
            native-godot/assets/models/shire_*_craftwork.glb
            native-godot/assets/models/shire_*_craftwork.source.json
          retention-days: 14
      - name: Build two original animated Blender wildlife models
        run: blender -b --factory-startup -t 2 --python native-godot/tools/blender_build_shire_wildlife.py
      - name: Verify Blender wildlife GLB animation and mesh budgets
        run: python3 native-godot/tools/verify_shire_wildlife.py
      - name: Upload editable Blender wildlife sources
        uses: actions/upload-artifact@v4
        with:
          name: ShireJourney-Wildlife-Editable-Blender
          path: blender-production/shire_wildlife/*.blend
          retention-days: 14
      - name: Upload two original animated wildlife GLBs
        uses: actions/upload-artifact@v4
        with:
          name: ShireJourney-Wildlife-Production-GLB
          path: |
            native-godot/assets/models/shire_*_animated.glb
            native-godot/assets/models/shire_*_animated.source.json
          retention-days: 14
      - name: Validate new Blender geometry and provenance
        run: python3 native-godot/tools/verify_blender_hero_art.py
      - name: Upload native editable Blender file
        uses: actions/upload-artifact@v4
        with:
          name: ShireJourney-Editable-BagEnd-Blender
          path: blender-production/bag_end_crafted_portal.blend
          retention-days: 14
      - name: Upload actual production GLB with SHA256 provenance
        uses: actions/upload-artifact@v4
        with:
          name: ShireJourney-Production-BagEnd-GLB
          path: |
            native-godot/assets/models/bag_end_crafted_portal.glb
            native-godot/assets/models/bag_end_crafted_portal.source.json
          retention-days: 14
      - name: Enforce shared cinematic chapter quality evidence contract
        run: python3 native-godot/tools/audit_quality_contract.py
      - name: Check Python asset dependencies
        run: python3 -m pip install --user numpy trimesh pillow pillow
      - name: Vendor CC0 rigged animated characters
        run: python3 native-godot/tools/vendor_cc0_characters.py
      - name: Vendor verified CC0 furniture glTF and PBR atlas
        run: python3 native-godot/tools/vendor_cc0_furniture.py
      - name: Vendor Poly Haven CC0 PBR photogrammetry (1K)
        run: python3 native-godot/tools/vendor_polyhaven_realistic.py
      - name: Vendor Poly Haven CC0 floor and plaster PBR textures
        run: python3 native-godot/tools/vendor_polyhaven_surfaces.py
      - name: Validate source, GLB and audio manifests
        run: python3 native-godot/tests/verify_native_release.py
      - name: Import assets and verify GDScript parse
        run: |
          set -euo pipefail
          # Godot's native .blend importer may spawn Blender again and stall a
          # headless scene import. Keep editable Blender sources outside res://.
          if find native-godot -type f -name '*.blend' | grep -q .; then
            echo 'FAIL: .blend source present inside Godot project import root'
            find native-godot -type f -name '*.blend'
            exit 1
          fi
          # An isolated import should not silently occupy the whole job budget.
          # --verbose makes the last asset being scanned visible in CI logs.
          timeout --signal=INT --kill-after=20s 10m \
            stdbuf -oL -eL godot --headless --verbose --path native-godot --import --quit \
            2>&1 | tee /tmp/shire-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error' /tmp/shire-import.log; then exit 1; fi
      - name: Run native clock/weather smoke
        run: godot --headless --path native-godot --script res://ci/headless_smoke.gd
      - name: Verify native social memory and 54 NPC records
        run: godot --headless --path native-godot --script res://ci/social_smoke.gd
      - name: Test Bag End and cottages through save-load transitions
        run: godot --headless --path native-godot --script res://ci/interior_integration_smoke.gd
      - name: Verify nine Hobbiton interiors and 27 bilingual household stories
        run: godot --headless --path native-godot --script res://ci/shire_nine_household_smoke.gd
      - name: Verify new Blender GLB is inside the playable Godot world
        run: godot --headless --path native-godot --script res://ci/hero_art_smoke.gd
      - name: Verify six new Blender district objects inside running Godot scene
        run: godot --headless --path native-godot --script res://ci/shire_district_art_smoke.gd
      - name: Verify seven built village districts, ten gardened homes and whole-town ecology
        run: godot --headless --path native-godot --script res://ci/shire_town_art_smoke.gd
      - name: Verify layered Shire woodland actually instantiates in Godot
        run: godot --headless --path native-godot --script res://ci/shire_woodland_smoke.gd
      - name: Verify authored GLB botanical surfaces inside actual running Shire scene
        run: godot --headless --path native-godot --script res://ci/shire_hero_botanical_smoke.gd
      - name: Verify 14-chapter bilingual screenplay graph and Shire journal beats
        run: godot --headless --path native-godot --script res://ci/campaign_story_smoke.gd
      - name: Verify 14 animated Blender wildlife in the Godot world
        run: godot --headless --path native-godot --script res://ci/shire_wildlife_smoke.gd
      - name: Test Frodo, Sam, Bilbo and Gandalf live skeletal imports and gait states
        run: godot --headless --path native-godot --script res://ci/hero_rig_smoke.gd
      - name: Verify orchard, river reeds and full foraging market loop
        run: godot --headless --path native-godot --script res://ci/shire_foraging_smoke.gd
      - name: Simulate opening scene for 120 frames
        run: godot --headless --path native-godot --quit-after 120
      - name: Capture in-engine screenshot via virtual display
        continue-on-error: true
        run: |
          mkdir -p native-godot/dist
          xvfb-run -a -s '-screen 0 1280x720x24' godot --rendering-driver opengl3 --path native-godot --script res://ci/capture_scene.gd
      - name: Test strict screenshot selection with synthetic regression fixtures
        run: python3 -m unittest discover -s native-godot/tools -p 'test_render_visibility.py' -v
      - name: Always preserve original Godot camera candidates for diagnosing regressions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShireJourney-Exterior-Camera-Diagnostics
          path: native-godot/dist/in_engine_hobbiton_candidate_*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Reject blank or obstructed game screenshots
        run: python3 native-godot/tools/verify_render_visibility.py
      - name: Upload in-engine screenshot when captured
        uses: actions/upload-artifact@v4
        with:
          name: ShireJourney-Godot-InEngine-Frame
          path: native-godot/dist/in_engine_*.png
          if-no-files-found: ignore
      - name: Export Windows executable
        run: |
          mkdir -p native-godot/dist
          godot --headless --path native-godot --export-release 'Windows Desktop' 'dist/ShireJourney.exe'
          test -s native-godot/dist/ShireJourney.exe
      - name: Upload Windows candidate (not performance validated)
        uses: actions/upload-artifact@v4
        with:
          name: ShireJourney-Godot4-Windows-Candidate
          path: native-godot/dist/*
          retention-days: 14

  windows-launch-smoke:
    needs: linux-import-smoke
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ShireJourney-Godot4-Windows-Candidate
          path: dist
      - name: Launch exported Windows EXE for 120 frames
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist\ShireJourney.exe'
          if (!(Test-Path $exe)) { throw "Windows EXE not found" }
          $output = & $exe --headless --quit-after 120 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { throw "Windows game exited with code $LASTEXITCODE" }
          if ($output -match 'SCRIPT ERROR|Parse Error') { throw "Godot script error in Windows smoke" }
  publish-blender-art:
    if: github.event_name == 'push'
    needs: [linux-import-smoke, windows-launch-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ShireJourney-Production-BagEnd-GLB
          path: native-godot/assets/models
      - uses: actions/download-artifact@v4
        with:
          name: ShireJourney-Districts-Production-GLB
          path: native-godot/assets/models
      - uses: actions/download-artifact@v4
        with:
          name: ShireJourney-Wildlife-Production-GLB
          path: native-godot/assets/models
      - name: Commit verified Blender GLB after both test jobs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-godot/assets/models/bag_end_crafted_portal.glb native-godot/assets/models/bag_end_crafted_portal.source.json
          git add native-godot/assets/models/shire_*_craftwork.glb native-godot/assets/models/shire_*_craftwork.source.json
          git add native-godot/assets/models/shire_*_animated.glb native-godot/assets/models/shire_*_animated.source.json
          if git diff --cached --quiet; then
            echo "Already committed"
          else
            git commit -m "art: publish verified Blender-produced Bag End GLB"
            git push origin HEAD:$GITHUB_REF_NAME
          fi
